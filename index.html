let st={c:null,i:0,s:null,danger:0,coop:0,hist:[],ending:"",submitted:false};
const A=()=>document.getElementById("app");

const SAVE_KEY="history_sim_mobile_save_v1";

function saveGame(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(st));
  }catch(e){}
}

function clearGameSave(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

function loadGame(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    const data=JSON.parse(raw);
    if(!data || !data.c || !data.s) return null;
    return data;
  }catch(e){ return null; }
}

function showResume(){
  const saved=loadGame();
  if(!saved){ start(); return; }
  A().innerHTML=`<div class=card>
  <h1>1938 : 식민지 조선에서 살아남기</h1>
  <div class=context><b>이전 플레이 기록이 있습니다.</b><br>${saved.c?.name||""} (${saved.c?.role||""}) · 사건 ${Math.min((saved.i||0)+1,8)} 진행 중</div>
  <button onclick=resumeGame()>이어하기</button>
  <div style="height:10px"></div>
  <button onclick=newGame()>처음부터 시작</button>
  </div>`;
}

function resumeGame(){
  const saved=loadGame();
  if(!saved){ start(); return; }
  st=saved;
  show();
}

function newGame(){
  clearGameSave();
  st={c:null,i:0,s:null,danger:0,coop:0,hist:[],ending:"",submitted:false};
  pickScreen();
}


function stats(){return `<div class=statbar>${["safe","life","resist","family"].map(k=>`<div class=stat>${({safe:"안전",life:"생계",resist:"저항",family:"가족"})[k]}<br><b>${st.s[k]}</b></div>`).join("")}<div class=stat>위험도<br><b>${st.danger}</b></div></div>`}
function start(){A().innerHTML=`<div class=card><h1>1938 : 식민지 조선에서 살아남기</h1><p>같은 시대라도 인물의 처지에 따라 고민은 달라집니다.</p><button onclick=pickScreen()>게임 시작</button></div>`}
function pickScreen(){A().innerHTML=`<div class=card><h2>캐릭터 선택</h2><div class=grid>${chars.map(c=>`<div class=char onclick="pick('${c.id}')"><b>${c.name} · ${c.role}</b><p>${c.intro}</p></div>`).join("")}</div></div>`}
function pick(id){st.c=chars.find(x=>x.id===id);st.s={...st.c.start};st.i=0;st.danger=0;st.coop=0;st.hist=[];st.ending="";st.submitted=false;saveGame();show()}
function current(){
 const b=base[st.i];
 if(st.i<4){const x=S[st.c.id][st.i];return {year:b[0],title:b[1],hist:b[2],ctx:x[0],opts:x[1]}}
 const x=late[st.i-4];return {year:b[0],title:b[1],hist:b[2],ctx:x.ctx[st.c.id],opts:x.opts}
}
function shuffled(opts){return opts.map((o,i)=>({o,i})).sort(()=>Math.random()-.5)}
function show(){
 if(st.danger>5)return arrest();
 const e=current(), ord=shuffled(e.opts);st.ord=ord;
 A().innerHTML=`<div class=card><div>${e.year} · ${st.c.name} (${st.c.role})</div>${stats()}<h2>${e.title}</h2><div class=context>${e.ctx}</div>${ord.map((x,j)=>`<button class=option onclick=choose(${j})>${String.fromCharCode(65+j)}. ${x.o[0]}</button>`).join("")}</div>`
}
function apply(d){for(const k of ["safe","life","resist","family"]){const raw=st.s[k]+(d[k]||0);if(raw<0){st.danger+=-raw;st.s[k]=0}else st.s[k]=Math.min(10,raw)}}
function choose(j){const e=current(),o=st.ord[j].o;apply(o[1]);st.coop+=o[2]||0;st.hist.push(`${e.year} ${e.title} → ${o[0]}`);saveGame();A().innerHTML=`<div class=card>${stats()}<h2>당신의 선택</h2><p><b>${o[0]}</b></p><div class=hist><b>역사적 배경</b><br>${e.hist}</div>${st.i<7?`<button onclick=next()>다음 사건 →</button>`:`<button onclick=end()>엔딩 보기 →</button>`}</div>`}
function next(){st.i++;saveGame();show()}
function arrest(){st.ending="경찰에 체포되다";saveGame();A().innerHTML=`<div class=card><h1>경찰에 체포되었습니다</h1>${stats()}<div class=warn>위험도가 5를 초과했습니다.</div><button onclick=reflect()>성찰 및 제출</button></div>`}
function end(){if(st.coop>=6)st.ending="식민지배에 적극 협력한 사람";else{const k=Object.entries(st.s).sort((a,b)=>b[1]-a[1])[0][0];st.ending=({safe:"위험을 피한 사람",life:"생활 기반을 붙잡은 사람",resist:"저항을 이어간 사람",family:"가족을 지킨 사람"})[k]}saveGame();A().innerHTML=`<div class=card><h1>광복을 맞았습니다</h1>${stats()}<div class=hist><h2>END │ ${st.ending}</h2></div><button onclick=reflect()>성찰 및 제출</button></div>`}
function reflect(){A().innerHTML=`<div class=card><h2>역사적 성찰 및 제출</h2><div class=row><div><div class=label>학번</div><input id=sid></div><div><div class=label>이름</div><input id=sname></div></div><div class=label>1. 가장 고민됐던 선택은 무엇이었나요?</div><textarea id=q1></textarea><div class=label>2. 식민지 상황에서 개인의 선택은 얼마나 자유로웠나요?</div><textarea id=q2></textarea><div class=label>3. ‘저항하지 않음’과 ‘식민지배에 동의함’은 같은 의미일까요?</div><textarea id=q3></textarea><div class=label>4. 민족말살정책이 조선인의 일상 깊숙이 개입했다는 근거는 무엇인가요?</div><textarea id=q4></textarea><div id=msg></div><button id=submitBtn onclick=submit()>교사에게 제출</button></div>`}
async function submit(){
  if(st.submitted){
    document.getElementById("msg").innerHTML='<div class=ok>이미 제출이 완료되었습니다.</div>';
    return;
  }
  const ids=["sid","sname","q1","q2","q3","q4"];
  const v=Object.fromEntries(ids.map(x=>[x,document.getElementById(x).value.trim()]));
  const m=document.getElementById("msg");
  const btn=document.getElementById("submitBtn");
  if(ids.some(x=>!v[x])){
    m.innerHTML='<div class=warn>모든 항목을 작성해주세요.</div>';
    return;
  }
  if(SUBMIT_URL.includes("PASTE_YOUR")){
    m.innerHTML='<div class=warn>교사용 제출 주소가 연결되지 않았습니다.</div>';
    return;
  }
  const p={
    studentId:v.sid,studentName:v.sname,
    characterName:st.c.name,characterRole:st.c.role,
    safe:st.s.safe,life:st.s.life,resist:st.s.resist,family:st.s.family,
    danger:st.danger,cooperation:st.coop,ending:st.ending,history:st.hist,
    q1:v.q1,q2:v.q2,q3:v.q3,q4:v.q4
  };
  btn.disabled=true;
  btn.textContent="제출 중...";
  try{
    const r=await fetch(SUBMIT_URL,{
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(p)
    });
    const d=await r.json();
    if(d.ok){
      st.submitted=true;
      saveGame();
      m.innerHTML='<div class=ok>✓ 제출 완료되었습니다. 이 화면을 교사에게 확인받아도 됩니다.</div>';
      btn.textContent="제출 완료";
      btn.disabled=true;
    }else{
      m.innerHTML=`<div class=warn>${d.message||"제출 실패"}</div>`;
      btn.disabled=false;
      btn.textContent="교사에게 제출";
    }
  }catch(e){
    m.innerHTML='<div class=warn>제출 연결에 실패했습니다. 인터넷 연결을 확인한 뒤 다시 시도해주세요.</div>';
    btn.disabled=false;
    btn.textContent="교사에게 제출";
  }
}

window.addEventListener("beforeunload", saveGame);
showResume();
</script></body></html>
