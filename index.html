<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한국사2 Ⅰ. 일제 식민 통치와 민족 운동 · 역사 탐정단</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ecf1;--card:#fff;--bd:#c5cdd8;--tx:#16202e;--mu:#5a6676;--ac:#b3261e;--bl:#2c5282;--ok:#1b7f4b;--no:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171f;--card:#1b2330;--bd:#33405280;--tx:#eef1f5;--mu:#9aa6b6;--ac:#ee6a5f;--bl:#7aa7e0;--ok:#4cc38a;--no:#ee6a5f}}
:root[data-theme="dark"]{--bg:#12171f;--card:#1b2330;--bd:#33405280;--tx:#eef1f5;--mu:#9aa6b6;--ac:#ee6a5f;--bl:#7aa7e0;--ok:#4cc38a;--no:#ee6a5f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
h1,h2,h3{font-family:"Gowun Batang",Batang,serif;margin:.2em 0}
.w{max-width:820px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--tx);padding-bottom:8px}
header h1{font-size:18px}
.mu{color:var(--mu);font-size:14px;margin:.3em 0}
.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px 14px;margin:10px 0;color:inherit;text-align:left;font:inherit;width:100%;box-sizing:border-box}
button{cursor:pointer;font:inherit;color:inherit}
button.card:focus-visible{outline:2px solid var(--bl);outline-offset:1px}
@media(hover:hover){button.card:hover{border-color:var(--bl)}}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding-bottom:96px}
button,.card{-webkit-user-select:none;user-select:none;min-height:44px}
#fb{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd);display:none;z-index:9}
#fb .b{display:block;width:100%;max-width:820px;margin:0 auto;padding:14px}
@media(min-width:700px){body{font-size:18px}.w{padding:24px}}
.g .card{margin:0}
.b{background:var(--tx);color:var(--bg);border:0;border-radius:6px;padding:11px 18px;font-weight:700;margin:6px 6px 0 0}
.b:disabled{opacity:.35;cursor:not-allowed}
.b.s{background:transparent;color:var(--tx);border:1px solid var(--tx)}
.bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:10px 0}
.bar button{background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 10px}
.ok{border:2px solid var(--ok)}.no{border:2px solid var(--no)}
.stamp{display:inline-block;border:3px solid;border-radius:4px;padding:0 10px;transform:rotate(-3deg);font-family:"Gowun Batang",serif;font-size:20px}
.ok .stamp{color:var(--ok)}.no .stamp{color:var(--no)}
.row{display:flex;gap:10px;align-items:center}.row>div{flex:1}
.n{background:var(--bl);color:var(--bg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:700;flex:none}
.slot{border:2px dashed var(--bd);border-radius:6px;padding:14px;margin:10px 0;color:var(--mu);text-align:center;font-size:14px}
.ctl{display:flex}.ctl button{background:none;border:1px solid var(--bd);border-radius:6px;margin-left:4px;min-width:44px;min-height:44px}
.yr{color:var(--bl);font-weight:700;margin-right:6px}
li{margin:6px 0}
.big{font:700 34px "Gowun Batang",serif;margin:.2em 0}
</style>
</head>
<body>
<div class="w">
<header><h1>🕵️ 역사 탐정단 · 한국사2</h1><button class="b s" id="sn" onclick="S.snd^=1;this.textContent=S.snd?'🔊':'🔇'" style="margin:0;padding:4px 10px">🔊</button></header>
<div id="app"></div>
</div>
<div id="fb"></div>
<script>
// 스파이: [주제, [일반3장 + 스파이1장(마지막)], 해설]
const SPY=[
["무단 통치기(1910년대)의 통치 방식",[["헌병 경찰제","헌병이 일반 경찰 업무까지 맡아 민중을 감시·통제하였다."],["조선 태형령","한국인에게만 적용된 태형(곤장)으로 즉결 처분하였다."],["회사령","회사 설립을 총독 허가제로 하여 민족 자본 성장을 억제하였다."],["보통 경찰제","3·1 운동 이후 헌병 경찰을 보통 경찰로 바꾸었다."]],"<b>보통 경찰제</b>는 3·1 운동 이후 도입된 <b>문화 통치(1919~)</b>의 정책입니다. 나머지는 1910년대 무단 통치를 대표합니다. 다만 보통 경찰제 도입 뒤에도 경찰 관서와 인원은 오히려 늘었습니다."],
["문화 통치기(1920년대)의 일제 정책",[["한글 신문 허용","동아일보·조선일보 등의 발행을 허가하였다(검열은 유지)."],["산미 증식 계획","일본의 식량 부족을 메우기 위해 쌀 증산을 추진하였다."],["치안 유지법","사회주의·독립운동 단속을 위해 제정하였다."],["지원병제","조선인을 전쟁에 동원하기 위해 시행하였다."]],"<b>지원병제</b>(1938)는 중일 전쟁 이후 <b>전시 체제기</b>의 정책입니다. 나머지는 1920년대 문화 통치기에 이루어졌습니다."],
["일제의 식민 통치 정책이 <u>아닌</u> 것",[["토지 조사 사업","기한부 신고제로 진행되어 토지 소유 관계가 바뀌었다."],["국가 총동원법","인적·물적 자원을 전쟁에 동원할 수 있게 한 법이다."],["창씨개명","성과 이름을 일본식으로 바꾸도록 강요하였다."],["6·10 만세 운동","순종 인산일에 학생·사회주의 세력이 준비한 항일 운동이다."]],"<b>6·10 만세 운동</b>(1926)은 일제 정책이 아니라 한국인의 <b>민족 운동</b>입니다. 나머지는 일제의 식민 통치·동원 정책입니다."],
["대한민국 임시정부의 활동",[["연통제·교통국","국내와 연결하는 비밀 행정·통신 조직이다."],["독립신문 발행","임시정부 기관지로 독립 의지를 알렸다."],["구미 위원부","미국 워싱턴에 설치하여 외교 활동을 전개하였다."],["신간회 창립","1927년 국내에서 비타협적 민족주의·사회주의 세력이 결성하였다."]],"<b>신간회</b>는 임시정부가 아니라 <b>국내</b>의 합법적 민족 유일당 단체입니다. 나머지는 임시정부(1919)의 활동입니다."],
["1920년대 만주의 독립군 활동",[["봉오동 전투","홍범도의 연합 부대가 일본군을 격파하였다."],["청산리 대첩","김좌진의 북로군정서와 홍범도 부대 등이 승리하였다."],["자유시 참변","소련 적군에 의해 독립군이 무장 해제되고 큰 피해를 입었다."],["쌍성보 전투","지청천의 한국독립군이 중국군과 연합하여 싸웠다."]],"<b>쌍성보 전투</b>는 만주 사변(1931) 이후인 <b>1930년대</b> 한·중 연합 작전입니다. 나머지는 1920~21년의 일입니다."],
["개인·소수의 거사로 일제 요인을 처단한 의열 투쟁",[["의열단","김원봉이 조직하고 「조선 혁명 선언」을 행동 지침으로 삼았다."],["한인 애국단","김구가 조직하여 이봉창·윤봉길 의거를 이끌었다."],["나석주 의거","식산 은행과 동양 척식 주식회사에 폭탄을 던졌다."],["영릉가 전투","양세봉의 조선 혁명군이 중국 의용군과 연합해 승리하였다."]],"<b>영릉가 전투</b>는 한·중 연합 <b>정규 무장 투쟁</b>입니다. 나머지는 소수가 거사를 벌인 <b>의열 투쟁</b>입니다."],
["1920년대 사회 운동",[["조선 형평사","진주에서 백정 차별 철폐를 내세웠다."],["어린이날 제정","방정환이 조직한 천도교 소년회가 어린이날을 제정하였다."],["근우회","신간회의 자매 단체로 여성 운동을 전개하였다."],["동양 척식 주식회사","일제가 식민지 경영을 위해 세운 회사로, 토지 개간과 이민 등을 맡았다."]],"<b>동양 척식 주식회사</b>는 일제가 식민지 경영을 위해 세운 회사로, 민족의 사회 운동이 아닙니다. 나머지는 한국인이 벌인 <b>사회 운동</b>입니다."],
["민족 문화 수호 노력",[["조선어 학회","한글 맞춤법 통일안을 만들고 사전 편찬을 추진하였다."],["박은식","『한국독립운동지사혈사』를 저술해 항일 투쟁을 정리하였다."],["신채호","『조선상고사』를 저술해 민족주의 사학을 세웠다."],["정체성론","한국은 중세 봉건 사회로 발전하지 못하고 고대 단계에 머물러 있다는 주장이다."]],"<b>정체성론</b>은 조선사 편수회에서 주장한 식민 사관입니다. 나머지는 우리 말·역사를 지키려는 <b>민족 문화 수호 운동</b>입니다."]
];
// 타임라인: [제목, [연대순 5장 [연도, 제목, 설명]]]
const TL=[
["식민 통치 정책의 흐름",[["1910","회사령","회사 설립에 총독 허가를 요구한 법령."],["1912","토지 조사령","기한부 신고제로 토지 조사 사업의 근거가 됨."],["1920","산미 증식 계획","일본의 쌀 부족 해결을 위한 쌀 증산 계획."],["1938","국가 총동원법","전쟁 수행을 위한 인적·물적 자원 동원 법령."],["1944","징병제 시행","조선인 청년을 징집(1943 공포, 1944 시행)."]]],
["3·1 운동과 항일 운동",[["1919.2","2·8 독립 선언","도쿄 유학생들이 독립을 선언."],["1919.3","3·1 운동","전국적 만세 운동으로 확산."],["1919.4","대한민국 임시정부 수립","상하이에서 민주 공화제로 수립."],["1926","6·10 만세 운동","순종 인산일에 일어난 만세 시위."],["1929","광주 학생 항일 운동","학생 충돌로 시작되어 전국으로 확산."]]],
["무장 투쟁과 임시정부의 활동",[["1920.6","봉오동 전투","홍범도 부대 등이 일본군을 격파."],["1920.10","청산리 대첩","김좌진·홍범도 부대 등이 승리."],["1921","자유시 참변","독립군이 소련 적군에 의해 큰 피해."],["1932","윤봉길 의거","한인 애국단원이 훙커우 공원에서 거사."],["1940","한국광복군 창설","임시정부가 충칭에서 창설한 정규군."]]],
["민족 운동과 사회 운동의 전개",[["1920","물산 장려 운동","평양에서 시작된 국산품 애용 운동."],["1923","암태도 소작 쟁의","고율 소작료에 맞선 농민 투쟁."],["1927","신간회 창립","비타협적 민족주의·사회주의 세력의 연대 단체."],["1929","원산 총파업","원산 노동자들의 대규모 파업."],["1933","한글 맞춤법 통일안","조선어 학회가 제정."]]]
];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
const S={snd:1};let ctx;
function fab(h){const f=$('#fb');f.innerHTML=h||'';f.style.display=h?'block':'none'}
function beep(ok){try{navigator.vibrate&&navigator.vibrate(ok?30:[60,40,60])}catch(e){}if(!S.snd)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();ctx.resume();const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime;o.connect(g);g.connect(ctx.destination);o.type=ok?'triangle':'sawtooth';o.frequency.setValueAtTime(ok?523:200,t);if(ok)o.frequency.setValueAtTime(784,t+.12);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.01,t+.3);o.start();o.stop(t+.3)}catch(e){}}
function bar(t){return`<div class="bar"><button onclick="bk(this)">← 나가기</button><b>${t}</b><span>${S.i+1}/${S.q.length} · 🏆 <b id="sc">${S.sc}</b>점</span></div>`}
function bk(b){if(b.dataset.a)return home();b.dataset.a=1;b.textContent='한 번 더 누르면 종료';setTimeout(()=>{b.dataset.a='';b.textContent='← 나가기'},2500)}
function home(){fab();$('#app').innerHTML=`<h2>일제 식민 통치와 민족 운동</h2><p class="mu">22개정 한국사2 Ⅰ단원 · 통치 정책, 3·1 운동, 민족 운동의 전개와 분화, 사회·문화 변화</p><div class="g"><button class="card" onclick="startSpy()"><h3>미션 1. 스파이를 찾아라</h3><p class="mu">4장 중 성격·시기가 다른 1장을 찾습니다.<br>${SPY.length}라운드 · 정답 10점</p></button><button class="card" onclick="startTL()"><h3>미션 2. 타임라인 연대기</h3><p class="mu">사건 카드 5장을 과거 → 최근 순으로 배열합니다.<br>${TL.length}세트 · 만점 20점</p></button></div><p class="mu">매번 카드와 문제 순서가 바뀌고, 끝나면 틀린 문제를 모아 보여 줍니다.</p>`}
function startSpy(){S.m='spy';S.q=sh(SPY);S.i=0;S.sc=0;S.wr=[];spy()}
function spy(){fab();const r=S.q[S.i];S.cs=sh(r[1].map((c,k)=>({t:c[0],d:c[1],s:k==3})));S.done=0;
$('#app').innerHTML=bar('미션 1 · 스파이 찾기')+`<div class="card"><h3>주제: ${r[0]}</h3><p class="mu">성격이나 시기가 다른 카드 1장을 고르세요.</p></div><div class="g">${S.cs.map((c,k)=>`<button class="card" id="c${k}" onclick="pick(${k})"><b>${'ABCD'[k]}. ${c.t}</b><p class="mu">${c.d}</p></button>`).join('')}</div><div id="res"></div>`}
function pick(k){if(S.done)return;S.done=1;const r=S.q[S.i],c=S.cs[k],ok=c.s;
S.cs.forEach((x,j)=>{if(x.s)$('#c'+j).classList.add('ok');else if(j==k)$('#c'+j).classList.add('no')});
if(ok)S.sc+=10;else S.wr.push(`<b>${r[0]}</b> → 스파이: ${S.cs.find(x=>x.s).t}`);
beep(ok);$('#sc').textContent=S.sc;
$('#res').innerHTML=`<div class="card ${ok?'ok':'no'}"><span class="stamp">${ok?'검거 성공 +10':'놓쳤다'}</span><p>${r[2]}</p></div>`;fab(`<button class="b" onclick="nx()">${S.i+1<S.q.length?'다음 라운드':'결과 보기'}</button>`);
$('#res').scrollIntoView({behavior:'smooth',block:'nearest'})}
function nx(){S.i++;S.i<S.q.length?(S.m=='spy'?spy():tl()):end()}
function startTL(){S.m='tl';S.q=sh(TL);S.i=0;S.sc=0;S.wr=[];tl()}
function tl(){const r=S.q[S.i];S.pool=sh(r[1].map((c,k)=>({k,y:c[0],t:c[1],x:c[2]})));S.sel=[];S.done=0;draw()}
function draw(){const r=S.q[S.i],d=S.done;
$('#app').innerHTML=bar('미션 2 · 타임라인')+`<div class="card"><h3>${r[0]}</h3><p class="mu">카드를 눌러 과거 → 최근 순서로 배치하세요. ▲▼로 순서를 바꿀 수 있습니다.</p></div>`+
[0,1,2,3,4].map(i=>{const c=S.sel[i];return c?`<div class="card row${d?(c.k==i?' ok':' no'):''}"><span class="n">${i+1}</span><div>${d?`<span class="yr">${c.y}</span>`:''}<b>${c.t}</b>${d?`<p class="mu">${c.x}</p>`:''}</div>${d?(c.k==i?'✓':'✗'):`<span class="ctl"><button onclick="mv(${i},-1)" aria-label="위로">▲</button><button onclick="mv(${i},1)" aria-label="아래로">▼</button><button onclick="rm(${i})" aria-label="빼기">✕</button></span>`}</div>`:`<div class="slot">${i+1}번째 카드를 선택하세요</div>`}).join('')+
(d?'':`<div class="g">${S.pool.map((c,i)=>`<button class="card" onclick="add(${i})"><b>${c.t}</b><p class="mu">${c.x}</p></button>`).join('')}</div>`)+'<div id="res"></div>';
fab(d?'':`<button class="b" ${S.sel.length<5?'disabled':''} onclick="sub()">${S.sel.length<5?`카드를 모두 배치하세요 (${S.sel.length}/5)`:'연대기 제출'}</button>`);
if(d){const n=S.sel.filter((c,i)=>c.k==i).length;$('#res').innerHTML=`<div class="card ${n==5?'ok':'no'}"><span class="stamp">${n==5?'완벽한 연대기 +20':n+'장 일치 +'+n*3}</span><h3>올바른 순서</h3><ol>${r[1].map(c=>`<li><span class="yr">${c[0]}</span><b>${c[1]}</b> — ${c[2]}</li>`).join('')}</ol></div>`;fab(`<button class="b" onclick="nx()">${S.i+1<S.q.length?'다음 세트':'결과 보기'}</button>`);$('#res').scrollIntoView({behavior:'smooth',block:'nearest'})}}
function add(i){S.sel.push(S.pool.splice(i,1)[0]);draw()}
function rm(i){S.pool.push(S.sel.splice(i,1)[0]);draw()}
function mv(i,d){const j=i+d;if(j<0||j>=S.sel.length)return;[S.sel[i],S.sel[j]]=[S.sel[j],S.sel[i]];draw()}
function sub(){const n=S.sel.filter((c,i)=>c.k==i).length;S.done=1;S.sc+=n==5?20:n*3;if(n<5)S.wr.push(`<b>${S.q[S.i][0]}</b> (${n}/5장 일치)`);beep(n==5);draw();$('#sc').textContent=S.sc}
function end(){fab();const mx=S.q.length*(S.m=='spy'?10:20),p=S.sc/mx;
const rk=p>=.9?'독립운동 수석 사학자':p>=.7?'역사 전문 탐정':p>=.5?'우수 수사관':'역사 입문자';
const msg=p>=.7?'핵심 개념을 잘 정리했습니다.':'오답노트를 복습한 뒤 다시 도전해 보세요.';
$('#app').innerHTML=`<div class="card"><h2>미션 종료</h2><p class="big">${S.sc} / ${mx}점</p><p>칭호: <b>${rk}</b><br><span class="mu">${msg}</span></p>${S.wr.length?`<h3>오답노트</h3><ul>${S.wr.map(w=>`<li>${w}</li>`).join('')}</ul>`:'<p><b>모두 맞혔습니다!</b></p>'}<button class="b" onclick="${S.m=='spy'?'startSpy':'startTL'}()">다시 도전</button><button class="b s" onclick="home()">메인으로</button></div>`;window.scrollTo(0,0)}
home();
</script>
</body>
</html>
